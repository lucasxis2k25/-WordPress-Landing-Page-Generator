[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-product-mapping"
version = "0.1.0"
description = "Incremental, cache-first ABC product mapping pipeline"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15,<23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
